services:
  app:
    image: ${APP_IMAGE:-customer-chat-analysis:lan}
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.1.0}
        APP_COMMIT_SHA: ${APP_COMMIT_SHA:-development}
        APP_BUILD_TIME: ${APP_BUILD_TIME:-development}
        APP_IMAGE: ${APP_IMAGE:-customer-chat-analysis:lan}
    container_name: ${APP_CONTAINER_NAME:-customer-chat-analysis}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8787}:8787"
    environment:
      PORT: "8787"
      LISTEN_HOST: "0.0.0.0"
      DATA_DIR: /app/data
      DATABASE_PATH: /app/data/app.db
      APP_VERSION: ${APP_VERSION:-0.1.0}
      APP_COMMIT_SHA: ${APP_COMMIT_SHA:-development}
      APP_BUILD_TIME: ${APP_BUILD_TIME:-development}
      APP_IMAGE: ${APP_IMAGE:-customer-chat-analysis:lan}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      FIRST_ADMIN_USERNAME: ${FIRST_ADMIN_USERNAME:-}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:-}
      FIRST_ADMIN_DISPLAY_NAME: ${FIRST_ADMIN_DISPLAY_NAME:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-2048}
      ANALYSIS_CONCURRENCY: ${ANALYSIS_CONCURRENCY:-2}
      ANALYSIS_BATCH_SIZE: ${ANALYSIS_BATCH_SIZE:-20}
      MIN_FREE_DISK_MB: ${MIN_FREE_DISK_MB:-512}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION: ${BACKUP_RETENTION:-7}
      CLEANUP_RETENTION_DAYS: ${CLEANUP_RETENTION_DAYS:-14}
      LOG_MAX_MB: ${LOG_MAX_MB:-10}
      LOG_RETENTION: ${LOG_RETENTION:-7}
    volumes:
      - ${DEPLOY_DATA_DIR:-./data}:/app/data
      - ${DEPLOY_KNOWLEDGE_DIR:-./knowledge}:/app/knowledge
    mem_limit: ${APP_MEMORY_LIMIT:-2g}
    cpus: ${APP_CPU_LIMIT:-2.0}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"
    deploy:
      replicas: 1
