# 内网 HTTPS 反向代理示例（nginx）
#
# 用途：与 deploy/docker-compose.yml 配合，在同一台局域网主机上终止 TLS，
# 再把请求转发给只发布在 127.0.0.1:${APP_PORT} 的应用容器。
#
# 边界要求：
# - 证书由组织内网 CA 签发（或自签名并导入内网客户端信任列表）；私钥只保存在
#   宿主机受保护目录，权限限制到代理进程账户，禁止进入 Git 或镜像。
# - 只允许批准的局域网网段访问本监听端口（见 docs/guides/lan-deployment.md）。
# - 不要在路由器/防火墙上把 443 或应用端口映射到公网。
# - 反向代理必须保留原始 Host（对应应用的 ALLOWED_HOSTS），
#   并把浏览器地址写成 ALLOWED_ORIGINS 中的同一个 https 源。
# - client_max_body_size 不得小于 MAX_UPLOAD_MB。

server {
    listen 443 ssl;
    server_name chat.example.lan;

    ssl_certificate     /etc/nginx/tls/chat.example.lan.crt;
    ssl_certificate_key /etc/nginx/tls/chat.example.lan.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 2048m;   # 与 MAX_UPLOAD_MB 保持一致
    proxy_read_timeout   7200s;   # 大文件导入与批量解析
    proxy_send_timeout   7200s;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
    }
}

server {
    listen 80;
    server_name chat.example.lan;
    return 301 https://$host$request_uri;
}
